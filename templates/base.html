
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Dear Wishlist ♡{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="navbar">

        <div class="nav-container">

            <!-- WEBSITE LOGO -->
            <a href="{{ url_for('home') }}" class="logo">
                ♡ Dear Wishlist ♡
            </a>

            <!-- NAVIGATION TABS -->
            <nav class="nav-links" aria-label="Main navigation">

                <a href="{{ url_for('home') }}"
                   class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">
                    🏠 Home
                </a>

                <a href="{{ url_for('wishlist') }}"
                   class="nav-link {% if request.endpoint == 'wishlist' %}active{% endif %}">
                    💗 My Wishlist
                </a>

                <a href="{{ url_for('categories') }}"
                   class="nav-link {% if request.endpoint == 'categories' %}active{% endif %}">
                    🛍️ Categories
                </a>

                <a href="{{ url_for('favorites') }}"
                   class="nav-link {% if request.endpoint == 'favorites' %}active{% endif %}">
                    ⭐ Favorites
                </a>

                <a href="{{ url_for('settings') }}"
                   class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}">
                    ⚙️ Settings
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN PAGE CONTENT -->
    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- WEBSITE FOOTER -->
    <footer class="footer">

        <p>Made with love ♡ Dear Wishlist</p>

        <p class="footer-subtitle">
            A little place for everything you love ♡
        </p>

    </footer>

    <!-- THEME PREFERENCE -->
    <script>
        const savedTheme = localStorage.getItem("dearWishlistTheme");

        if (savedTheme) {
            document.body.dataset.theme = savedTheme;
        }
    </script>

</body>
</html>
